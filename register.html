<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - Lubaga IT Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #e8edf5 0%, #d5dce6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .register-container {
            max-width: 440px;
            width: 100%;
            margin: 20px;
        }
        .register-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            overflow: hidden;
            transition: 0.3s;
        }
        .register-card:hover {
            box-shadow: 0 25px 70px rgba(0,0,0,0.2);
        }
        .register-header {
            background: linear-gradient(135deg, #0a58ca 0%, #0d6efd 100%);
            padding: 35px 30px 30px;
            text-align: center;
            color: #fff;
        }
        .register-header .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            background: #fff;
        }
        .register-header .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 8px;
        }
        .register-header h3 { margin: 0; font-weight: 700; }
        .register-header p { margin: 5px 0 0; opacity: 0.85; font-size: 14px; }
        .register-header .badge-register {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }
        .register-body { padding: 30px; }
        .register-body .form-control {
            border-radius: 10px;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            transition: 0.3s;
        }
        .register-body .form-control:focus {
            border-color: #0a58ca;
            box-shadow: 0 0 0 0.2rem rgba(10, 88, 202, 0.15);
        }
        .register-body .btn-primary {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            font-size: 16px;
            background: #0a58ca;
            border: none;
        }
        .register-body .btn-primary:hover {
            background: #084298;
        }
        .register-footer {
            text-align: center;
            padding: 0 30px 30px;
            color: #6c757d;
        }
        .register-footer a {
            color: #0a58ca;
            text-decoration: none;
            font-weight: 600;
        }
        .register-footer a:hover { text-decoration: underline; }
        .alert-danger, .alert-success { border-radius: 10px; }
        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
    </style>
</head>
<body>

<div class="register-container">
    <div class="register-card">
        <div class="register-header">
            <div class="logo">
                <img src="lubaga badge.webp" alt="Lubaga Hospital Logo">
            </div>
            <h3>Lubaga Hospital</h3>
            <p>IT Department – Projector Tracker</p>
            <span class="badge-register"><i class="bi bi-person-plus"></i> Create Account</span>
        </div>
        <div class="register-body">
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div id="registerError" class="alert alert-danger" style="display:none;"></div>
                <div id="registerSuccess" class="alert alert-success" style="display:none;"></div>
                
                <!-- ===== USERNAME ===== -->
                <div class="mb-3">
                    <label class="form-label fw-semibold"><i class="bi bi-person"></i> Username <span class="text-danger">*</span></label>
                    <input type="text" id="registerUser" class="form-control" placeholder="Choose a username" required autofocus>
                    <small class="text-muted">Minimum 3 characters</small>
                </div>
                
                <!-- ===== EMAIL ===== -->
                <div class="mb-3">
                    <label class="form-label fw-semibold"><i class="bi bi-envelope"></i> Email Address <span class="text-danger">*</span></label>
                    <input type="email" id="registerEmail" class="form-control" placeholder="Enter your email address" required>
                    <small class="text-muted">We'll send you account updates</small>
                </div>
                
                <!-- ===== PASSWORD ===== -->
                <div class="mb-3">
                    <label class="form-label fw-semibold"><i class="bi bi-lock"></i> Password <span class="text-danger">*</span></label>
                    <input type="password" id="registerPass" class="form-control" placeholder="Min 6 characters" required>
                    <small class="text-muted">Minimum 6 characters</small>
                </div>
                
                <!-- ===== CONFIRM PASSWORD ===== -->
                <div class="mb-3">
                    <label class="form-label fw-semibold"><i class="bi bi-lock"></i> Confirm Password <span class="text-danger">*</span></label>
                    <input type="password" id="registerPassConfirm" class="form-control" placeholder="Confirm your password" required>
                </div>
                
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-person-plus"></i> Create Account
                </button>
            </form>
        </div>
        <div class="register-footer">
            Already have an account? <a href="index.html">Login here</a>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast-container">
    <div id="liveToast" class="toast align-items-center text-white border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body" id="toastMessage"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const USERS_KEY = 'lubaga_users';
    const SESSION_KEY = 'lubaga_session';

    function getUsers() {
        try {
            const raw = localStorage.getItem(USERS_KEY);
            return raw ? JSON.parse(raw) : {};
        } catch { return {}; }
    }

    function saveUsers(users) {
        localStorage.setItem(USERS_KEY, JSON.stringify(users));
    }

    function showToast(message, type = 'success') {
        const toast = document.getElementById('liveToast');
        const body = document.getElementById('toastMessage');
        body.textContent = message;
        toast.className = 'toast align-items-center text-white border-0';
        if (type === 'success') toast.classList.add('bg-success');
        else if (type === 'danger') toast.classList.add('bg-danger');
        else if (type === 'warning') toast.classList.add('bg-warning');
        else toast.classList.add('bg-primary');
        new bootstrap.Toast(toast, { delay: 4000 }).show();
    }

    function handleRegister(e) {
        e.preventDefault();
        
        const errorEl = document.getElementById('registerError');
        const successEl = document.getElementById('registerSuccess');
        errorEl.style.display = 'none';
        successEl.style.display = 'none';
        errorEl.textContent = '';
        successEl.textContent = '';

        const username = document.getElementById('registerUser').value.trim();
        const email = document.getElementById('registerEmail').value.trim();
        const password = document.getElementById('registerPass').value;
        const confirm = document.getElementById('registerPassConfirm').value;

        // Validate
        if (!username || username.length < 3) {
            errorEl.textContent = ' Username must be at least 3 characters.';
            errorEl.style.display = 'block';
            return;
        }
        if (!email || !email.includes('@') || !email.includes('.')) {
            errorEl.textContent = ' Please enter a valid email address.';
            errorEl.style.display = 'block';
            return;
        }
        if (!password || password.length < 6) {
            errorEl.textContent = ' Password must be at least 6 characters.';
            errorEl.style.display = 'block';
            return;
        }
        if (password !== confirm) {
            errorEl.textContent = ' Passwords do not match.';
            errorEl.style.display = 'block';
            return;
        }

        // Check if email already exists
        const users = getUsers();
        for (const [existingUser, userData] of Object.entries(users)) {
            if (userData.email && userData.email.toLowerCase() === email.toLowerCase()) {
                errorEl.textContent = ' This email is already registered. Please login.';
                errorEl.style.display = 'block';
                return;
            }
        }
        
        // Check if username already exists
        if (users[username]) {
            errorEl.textContent = ' Username already exists. Please choose another.';
            errorEl.style.display = 'block';
            return;
        }

        // Save user (store username + password + email)
        users[username] = {
            password: password,
            email: email
        };
        saveUsers(users);

        successEl.innerHTML = ' Account "' + username + '" created successfully!';
        successEl.style.display = 'block';
        showToast(' Account created! Please login.', 'success');

        // Clear form
        document.getElementById('registerUser').value = '';
        document.getElementById('registerEmail').value = '';
        document.getElementById('registerPass').value = '';
        document.getElementById('registerPassConfirm').value = '';

        setTimeout(() => {
            window.location.href = 'index.html';
        }, 2000);
    }

    (function checkSession() {
        const session = localStorage.getItem(SESSION_KEY);
        const users = getUsers();
        if (session && users[session]) {
            window.location.href = 'dashboard.html';
        }
    })();
</script>
</body>
</html>
