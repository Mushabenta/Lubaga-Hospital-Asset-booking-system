<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register - Lubaga Hospital Asset Booking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #e8f0fe 0%, #f5f5f5 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .auth-container {
            max-width: 480px;
            width: 100%;
            background: #fff;
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            position: relative;
            overflow: hidden;
        }
        .auth-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: #0a58ca;
        }
        .auth-container .auth-header { text-align: center; margin-bottom: 24px; }
        .auth-container .auth-header .logo {
            width: 80px; height: 80px;
            background: #0a58ca;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 40px;
            color: #fff;
            box-shadow: 0 8px 25px rgba(10, 88, 202, 0.3);
        }
        .auth-container .auth-header h2 { font-weight: 700; color: #0a58ca; font-size: 24px; margin: 0; }
        .auth-container .auth-header p { color: #6c757d; font-size: 14px; margin-top: 4px; }
        .auth-container .auth-header .highlight { color: #fd7e14; font-weight: 700; }
        .admin-notice {
            background: #fff3e0;
            border-left: 4px solid #fd7e14;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 12px;
        }
        .admin-notice .notice-icon { font-size: 22px; color: #fd7e14; flex-shrink: 0; }
        .admin-notice .notice-text { font-size: 13px; color: #495057; line-height: 1.4; }
        .admin-notice .notice-text strong { color: #0a58ca; }
        .admin-notice .notice-text .highlight-text { color: #fd7e14; font-weight: 700; }
        .auth-container .form-label { font-weight: 600; font-size: 13px; color: #495057; }
        .auth-container .form-control, .auth-container .form-select {
            border-radius: 10px;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            transition: 0.2s;
            font-size: 14px;
        }
        .auth-container .form-control:focus, .auth-container .form-select:focus {
            border-color: #0a58ca;
            box-shadow: 0 0 0 3px rgba(10, 88, 202, 0.12);
        }
        .auth-container .btn-primary {
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            width: 100%;
            font-size: 16px;
            background: #0a58ca;
            border: none;
            transition: 0.3s;
            color: #fff;
        }
        .auth-container .btn-primary:hover {
            background: #084298;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(10, 88, 202, 0.35);
        }
        .auth-container .btn-primary i { color: #fd7e14; }
        .auth-container .auth-link { text-align: center; margin-top: 20px; font-size: 14px; color: #6c757d; }
        .auth-container .auth-link a { color: #0a58ca; text-decoration: none; font-weight: 600; }
        .auth-container .auth-link a:hover { text-decoration: underline; color: #fd7e14; }
        .input-icon { position: relative; }
        .input-icon i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #adb5bd;
            font-size: 18px;
            z-index: 1;
        }
        .input-icon .form-control, .input-icon .form-select { padding-left: 45px; }
        .input-icon .orange-icon { color: #fd7e14; }
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            max-width: 90%;
        }
        .toast {
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            border: none;
            min-width: 200px;
            max-width: 420px;
        }
        .toast .toast-body { font-size: 14px; padding: 14px 18px; font-weight: 500; }
        .toast .btn-close { padding: 10px; filter: brightness(0) invert(1); opacity: 0.8; }
        .toast .btn-close:hover { opacity: 1; }
        @media (max-width: 576px) {
            .auth-container { padding: 30px 20px; margin: 0 10px; }
            .auth-container .auth-header h2 { font-size: 20px; }
            .auth-container .auth-header .logo { width: 60px; height: 60px; font-size: 30px; }
            .admin-notice { padding: 10px 14px; font-size: 12px; }
            .admin-notice .notice-icon { font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-header">
        <div class="logo"><i class="bi bi-hospital"></i></div>
        <h2>Create Account</h2>
        <p>Register for the <span class="highlight">Asset Booking System</span></p>
    </div>

    <div class="admin-notice" id="adminNotice">
        <div class="notice-icon"><i class="bi bi-shield-lock"></i></div>
        <div class="notice-text">
            <strong>First User = General Admin</strong><br />
            The first person to register becomes the <span class="highlight-text">General Admin</span> with full system access.
        </div>
    </div>

    <form id="registerForm">
        <div class="mb-3 input-icon">
            <i class="bi bi-person"></i>
            <input type="text" class="form-control" id="regUsername" placeholder="Choose a username" required>
        </div>
        <div class="mb-3 input-icon">
            <i class="bi bi-envelope"></i>
            <input type="email" class="form-control" id="regEmail" placeholder="Enter your email" required>
        </div>
        <div class="mb-3 input-icon">
            <i class="bi bi-lock"></i>
            <input type="password" class="form-control" id="regPassword" placeholder="Min 6 characters" required>
        </div>
        <div class="mb-3 input-icon">
            <i class="bi bi-building"></i>
            <select class="form-select" id="regDept" required>
                <option value="">Select Department</option>
                <option value="Cardiology">Cardiology</option>
                <option value="Oncology">Oncology</option>
                <option value="Neurology">Neurology</option>
                <option value="Pediatrics">Pediatrics</option>
                <option value="Orthopedics">Orthopedics</option>
                <option value="Dermatology">Dermatology</option>
                <option value="Endocrinology">Endocrinology</option>
                <option value="Gastroenterology">Gastroenterology</option>
                <option value="Nephrology">Nephrology</option>
                <option value="Pulmonology">Pulmonology</option>
                <option value="Rheumatology">Rheumatology</option>
                <option value="Urology">Urology</option>
                <option value="Gynecology">Gynecology</option>
                <option value="Obstetrics">Obstetrics</option>
                <option value="Emergency">Emergency</option>
                <option value="ICU">ICU</option>
                <option value="Operating Theatre">Operating Theatre</option>
                <option value="Radiology">Radiology</option>
                <option value="Laboratory">Laboratory</option>
                <option value="Pharmacy">Pharmacy</option>
                <option value="Physiotherapy">Physiotherapy</option>
                <option value="Occupational Therapy">Occupational Therapy</option>
                <option value="Speech Therapy">Speech Therapy</option>
                <option value="Nutrition">Nutrition</option>
                <option value="Dental">Dental</option>
                <option value="Ophthalmology">Ophthalmology</option>
                <option value="ENT">ENT</option>
                <option value="Psychiatry">Psychiatry</option>
                <option value="Administration">Administration</option>
                <option value="Human Resources">Human Resources</option>
                <option value="Finance">Finance</option>
                <option value="Procurement">Procurement</option>
                <option value="IT">IT</option>
                <option value="Facilities">Facilities</option>
                <option value="Maintenance">Maintenance</option>
                <option value="Housekeeping">Housekeeping</option>
                <option value="Security">Security</option>
                <option value="Catering">Catering</option>
                <option value="Laundry">Laundry</option>
            </select>
        </div>
        <div class="mb-3 input-icon">
            <i class="bi bi-question-circle orange-icon"></i>
            <select class="form-select" id="regSecurityQuestion" required>
                <option value="">Select a security question</option>
                <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
                <option value="What village were you born in?">What village were you born in?</option>
                <option value="What is your clan name?">What is your clan name?</option>
                <option value="What was the name of your primary school?">What was the name of your primary school?</option>
                <option value="Who is your favorite Ugandan musician?">Who is your favorite Ugandan musician?</option>
                <option value="What is your favorite local dish?">What is your favorite local dish?</option>
            </select>
        </div>
        <div class="mb-3 input-icon">
            <i class="bi bi-shield-check"></i>
            <input type="text" class="form-control" id="regSecurityAnswer" placeholder="Your answer" required>
        </div>
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-person-plus me-2"></i>Register
        </button>
    </form>
    <div class="auth-link">
        Already have an account? <a href="index.html">Login here</a>
    </div>
</div>

<!-- Toast -->
<div class="toast-container">
    <div id="liveToast" class="toast align-items-center text-white border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body" id="toastMessage"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const USERS_KEY = 'lubaga_users';
    const SESSION_KEY = 'lubaga_session';

    function getUsers() {
        try { const raw = localStorage.getItem(USERS_KEY); return raw ? JSON.parse(raw) : {}; } catch { return {}; }
    }

    function saveUsers(users) { localStorage.setItem(USERS_KEY, JSON.stringify(users)); }

    function showToast(message, type = 'success') {
        const toast = document.getElementById('liveToast');
        const body = document.getElementById('toastMessage');
        body.textContent = message;
        toast.className = 'toast align-items-center text-white border-0';
        if (type === 'success') toast.classList.add('bg-success');
        else if (type === 'danger') toast.classList.add('bg-danger');
        else if (type === 'warning') toast.classList.add('bg-warning');
        else toast.classList.add('bg-primary');
        new bootstrap.Toast(toast, { delay: 4000 }).show();
    }

    (function checkFirstUser() {
        const users = getUsers();
        const isFirstUser = Object.keys(users).length === 0;
        const notice = document.getElementById('adminNotice');
        notice.style.display = isFirstUser ? 'flex' : 'none';
    })();

    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const username = document.getElementById('regUsername').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;
        const department = document.getElementById('regDept').value;
        const securityQuestion = document.getElementById('regSecurityQuestion').value;
        const securityAnswer = document.getElementById('regSecurityAnswer').value.trim().toLowerCase();

        if (!username || username.length < 3) { showToast('Username must be at least 3 characters.', 'danger'); return; }
        if (!email || !email.includes('@')) { showToast('Valid email is required.', 'danger'); return; }
        if (!password || password.length < 6) { showToast('Password must be at least 6 characters.', 'danger'); return; }
        if (!department) { showToast('Please select a department.', 'danger'); return; }
        if (!securityQuestion) { showToast('Please select a security question.', 'danger'); return; }
        if (!securityAnswer || securityAnswer.length < 2) { showToast('Please provide a security answer.', 'danger'); return; }

        const users = getUsers();

        if (users[username]) { showToast('Username already exists.', 'danger'); return; }
        for (const [u, data] of Object.entries(users)) {
            if (data.email && data.email.toLowerCase() === email.toLowerCase()) {
                showToast('Email already registered.', 'danger');
                return;
            }
        }

        const isFirstUser = Object.keys(users).length === 0;
        const role = isFirstUser ? 'general_admin' : 'staff';

        users[username] = {
            password: password,
            email: email,
            department: department,
            role: role,
            active: true,
            securityQuestion: securityQuestion,
            securityAnswer: securityAnswer,
            createdAt: new Date().toISOString().split('T')[0]
        };

        saveUsers(users);

        // Auto-login the user
        localStorage.setItem(SESSION_KEY, username);

        const roleText = role === 'general_admin' ?
            '🎉 You are the General Admin! Redirecting to dashboard...' :
            'Registration successful! Redirecting...';

        showToast(roleText, 'success');

        setTimeout(function() {
            if (role === 'general_admin') {
                window.location.href = 'admin-dashboard.html';
            } else {
                window.location.href = 'user-dashboard.html';
            }
        }, 1000);
    });
</script>
</body>
</html>
