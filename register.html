<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register - Lubaga Hospital Asset Booking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #e8edf5 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            margin: 0;
        }
        .auth-container {
            max-width: 540px;
            width: 100%;
            background: #fff;
            border-radius: 28px;
            padding: 40px 35px 35px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
            margin: 10px;
        }
        .auth-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: #fd7e14;
        }
        .auth-container .auth-header { 
            text-align: center; 
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
        }
        .auth-container .auth-header .logo {
            width: 100%;
            max-width: 280px;
            height: auto;
            max-height: 160px;
            min-height: 100px;
            background: transparent;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            overflow: hidden;
            padding: 0;
            position: relative;
        }
        .auth-container .auth-header .logo img {
            width: 100%;
            height: 100%;
            max-height: 150px;
            object-fit: contain;
            display: block;
            transition: transform 0.3s ease;
        }
        .auth-container .auth-header .logo img:hover {
            transform: scale(1.03);
        }
        .auth-container .auth-header .logo i {
            font-size: 70px;
            color: #fd7e14;
            display: none;
            background: rgba(253, 126, 20, 0.08);
            padding: 20px;
            border-radius: 20px;
        }
        .auth-container .auth-header h2 { 
            font-weight: 800; 
            color: #0a58ca; 
            font-size: 24px; 
            margin: 0;
            letter-spacing: -0.5px;
        }
        .auth-container .auth-header p { 
            color: #6c757d; 
            font-size: 14px; 
            margin-top: 4px;
            font-weight: 400;
        }
        .auth-container .auth-header .highlight { 
            color: #fd7e14; 
            font-weight: 700; 
        }
        .admin-notice {
            background: linear-gradient(135deg, #fff8f0, #fff3e0);
            border-left: 5px solid #fd7e14;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 18px;
            display: none;
            align-items: flex-start;
            gap: 12px;
            position: relative;
            z-index: 1;
        }
        .admin-notice .notice-icon { 
            font-size: 22px; 
            color: #fd7e14; 
            flex-shrink: 0;
            margin-top: 1px;
        }
        .admin-notice .notice-text { 
            font-size: 13px; 
            color: #495057; 
            line-height: 1.5; 
        }
        .admin-notice .notice-text strong { color: #0a58ca; }
        .admin-notice .notice-text .highlight-text { 
            color: #fd7e14; 
            font-weight: 700; 
        }
        .auth-container .form-label { 
            font-weight: 600; 
            font-size: 13px; 
            color: #495057; 
            margin-bottom: 4px;
        }
        .auth-container .form-control, .auth-container .form-select {
            border-radius: 12px;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            transition: 0.25s ease;
            font-size: 14px;
            background-color: #fafbfc;
            width: 100%;
        }
        .auth-container .form-control:focus, .auth-container .form-select:focus {
            border-color: #0a58ca;
            box-shadow: 0 0 0 4px rgba(10, 88, 202, 0.1);
            background-color: #fff;
        }
        .auth-container .form-control::placeholder {
            color: #adb5bd;
            font-size: 13px;
        }
        .auth-container .btn-primary {
            padding: 13px;
            border-radius: 12px;
            font-weight: 700;
            width: 100%;
            font-size: 16px;
            background: linear-gradient(135deg, #0a58ca, #0d6efd);
            border: none;
            transition: 0.3s ease;
            color: #fff;
            letter-spacing: 0.3px;
            position: relative;
            z-index: 1;
            box-shadow: 0 4px 15px rgba(10, 88, 202, 0.3);
        }
        .auth-container .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 35px rgba(10, 88, 202, 0.4);
        }
        .auth-container .btn-primary:active {
            transform: translateY(0);
        }
        .auth-container .btn-primary i { 
            color: #fd7e14;
            font-size: 18px;
            margin-right: 6px;
        }
        .auth-container .auth-link { 
            text-align: center; 
            margin-top: 18px; 
            font-size: 14px; 
            color: #6c757d; 
            position: relative;
            z-index: 1;
        }
        .auth-container .auth-link a { 
            color: #0a58ca; 
            text-decoration: none; 
            font-weight: 700; 
            transition: 0.2s;
        }
        .auth-container .auth-link a:hover { 
            text-decoration: underline; 
            color: #fd7e14; 
        }
        .input-icon { 
            position: relative; 
            z-index: 1;
        }
        .input-icon i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #adb5bd;
            font-size: 18px;
            z-index: 2;
            transition: 0.2s;
        }
        .input-icon .form-control:focus + i,
        .input-icon .form-select:focus + i {
            color: #0a58ca;
        }
        .input-icon .form-control, 
        .input-icon .form-select { 
            padding-left: 46px; 
        }
        .input-icon .orange-icon { 
            color: #fd7e14; 
        }
        /* SINGLE ARROW - NATIVE BROWSER ARROW ONLY */
        .input-icon .form-select {
            padding-left: 46px;
            padding-right: 18px;
            appearance: auto;
            -webkit-appearance: auto;
            -moz-appearance: auto;
            background-image: none !important;
            min-height: 46px;
        }
        .input-icon .form-select::-ms-expand {
            display: block;
        }
        .input-icon .form-select option {
            padding: 8px 12px;
        }
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            max-width: 90%;
        }
        .toast {
            border-radius: 14px;
            box-shadow: 0 8px 35px rgba(0, 0, 0, 0.2);
            border: none;
            min-width: 200px;
            max-width: 420px;
        }
        .toast .toast-body { 
            font-size: 14px; 
            padding: 14px 18px; 
            font-weight: 500; 
        }
        .toast .btn-close { 
            padding: 12px; 
            filter: brightness(0) invert(1); 
            opacity: 0.8; 
        }
        .toast .btn-close:hover { opacity: 1; }

        /* ============================================================
           SMALL SCREEN FIXES
           ============================================================ */
        @media (max-width: 576px) {
            body {
                padding: 10px;
                align-items: flex-start;
                padding-top: 20px;
            }
            .auth-container { 
                padding: 24px 18px 22px; 
                margin: 0;
                border-radius: 20px;
                max-width: 100%;
            }
            .auth-container .auth-header { 
                margin-bottom: 18px;
            }
            .auth-container .auth-header h2 { 
                font-size: 20px; 
            }
            .auth-container .auth-header p { 
                font-size: 13px; 
            }
            .auth-container .auth-header .logo { 
                max-width: 200px;
                max-height: 120px;
                min-height: 80px;
                margin: 0 auto 10px;
            }
            .auth-container .auth-header .logo img {
                max-height: 110px;
            }
            .auth-container .auth-header .logo i {
                font-size: 50px;
                padding: 14px;
            }
            .admin-notice { 
                padding: 10px 12px; 
                font-size: 12px;
                margin-bottom: 14px;
            }
            .admin-notice .notice-icon { 
                font-size: 18px; 
            }
            .admin-notice .notice-text { 
                font-size: 12px; 
            }
            .auth-container .btn-primary {
                font-size: 15px;
                padding: 12px;
            }
            .input-icon .form-control, 
            .input-icon .form-select { 
                padding-left: 42px; 
                padding-top: 11px;
                padding-bottom: 11px;
                font-size: 14px;
                min-height: 46px;
            }
            .input-icon i {
                left: 14px;
                font-size: 16px;
            }
            .auth-container .form-control,
            .auth-container .form-select {
                font-size: 14px;
                padding: 11px 14px;
            }
            .auth-container .auth-link { 
                font-size: 13px;
                margin-top: 14px;
            }
            .input-icon .form-select {
                min-height: 46px;
                padding-left: 42px;
                padding-right: 14px;
            }
        }

        @media (max-width: 400px) {
            body {
                padding: 6px;
                padding-top: 12px;
            }
            .auth-container { 
                padding: 18px 14px 16px; 
                border-radius: 16px;
            }
            .auth-container .auth-header .logo { 
                max-width: 160px;
                max-height: 90px;
                min-height: 60px;
            }
            .auth-container .auth-header .logo img {
                max-height: 80px;
            }
            .auth-container .auth-header .logo i {
                font-size: 40px;
                padding: 12px;
            }
            .auth-container .auth-header h2 { 
                font-size: 18px; 
            }
            .auth-container .auth-header p { 
                font-size: 12px; 
            }
            .auth-container .btn-primary {
                font-size: 14px;
                padding: 10px;
            }
            .input-icon .form-control, 
            .input-icon .form-select { 
                padding-left: 38px; 
                padding-top: 9px;
                padding-bottom: 9px;
                font-size: 13px;
                min-height: 40px;
                padding-right: 12px;
            }
            .input-icon i {
                left: 12px;
                font-size: 14px;
            }
            .auth-container .form-control,
            .auth-container .form-select {
                font-size: 13px;
                padding: 9px 12px;
            }
            .auth-container .auth-link { 
                font-size: 12px;
                margin-top: 12px;
            }
            .admin-notice { 
                padding: 8px 10px; 
                font-size: 11px;
                margin-bottom: 10px;
            }
            .admin-notice .notice-text { 
                font-size: 11px; 
            }
            .input-icon .form-select {
                min-height: 40px;
                padding-left: 38px;
                padding-right: 12px;
            }
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-header">
        <div class="logo">
            <img src="lubaga logo.png" alt="Lubaga Hospital" id="hospitalLogo"
                 onerror="this.style.display='none'; document.getElementById('logoIcon').style.display='flex'">
            <i id="logoIcon" class="bi bi-hospital" style="display:none;"></i>
        </div>
        <h2>Create Account</h2>
        <p>Register for the <span class="highlight">Asset Booking System</span></p>
    </div>

    <div class="admin-notice" id="adminNotice">
        <div class="notice-icon"><i class="bi bi-shield-lock-fill"></i></div>
        <div class="notice-text">
            <strong>First User = General Admin</strong><br />
            The first person to register becomes the <span class="highlight-text">General Admin</span> with full system access.
        </div>
    </div>

    <form id="registerForm">
        <div class="mb-3 input-icon">
            <i class="bi bi-person"></i>
            <input type="text" class="form-control" id="regUsername" placeholder="Choose a username" required>
        </div>
        <div class="mb-3 input-icon">
            <i class="bi bi-envelope"></i>
            <input type="email" class="form-control" id="regEmail" placeholder="Enter your email" required>
        </div>
        <div class="mb-3 input-icon">
            <i class="bi bi-phone"></i>
            <input type="text" class="form-control" id="regPhone" placeholder="Phone number (e.g., 0772123456)" required>
        </div>
        <div class="mb-3 input-icon">
            <i class="bi bi-lock"></i>
            <input type="password" class="form-control" id="regPassword" placeholder="Password (min 4 characters)" required>
        </div>
        <div class="mb-3 input-icon">
            <i class="bi bi-shield-lock"></i>
            <input type="password" class="form-control" id="regConfirmPassword" placeholder="Confirm password" required>
        </div>
        <div class="mb-3 input-icon">
            <i class="bi bi-diagram-2"></i>
            <select class="form-select" id="regServiceElement" onchange="updateDepartments()" required>
                <option value="">Select Service Element</option>
            </select>
        </div>
        <div class="mb-3 input-icon">
            <i class="bi bi-building"></i>
            <select class="form-select" id="regDepartment" required>
                <option value="">Select Department</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-person-plus me-2"></i>Register
        </button>
    </form>
    <div class="auth-link">
        Already have an account? <a href="index.html">Login here</a>
    </div>
</div>

<!-- Toast -->
<div class="toast-container">
    <div id="liveToast" class="toast align-items-center text-white border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body" id="toastMessage"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const SESSION_KEY = 'lubaga_session';
    const TOKEN_KEY = 'lubaga_token';
    const USER_KEY = 'lubaga_user';

    // Backend endpoint base. Empty string = same origin (request goes to the
    // same host, which proxies /api/* to the API). On Netlify the proxy in
    // netlify.toml forwards /api/* to the Railway backend, so no CORS is
    // needed. Override by setting localStorage['lubaga_api_base'] if you host
    // the frontend without a proxy.
    const API_BASE = (localStorage.getItem('lubaga_api_base') || '').replace(/\/+$/, '');

    function apiPost(url, body) {
        return fetch(API_BASE + url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body || {})
        }).then(function(res) {
            return res.json().catch(function() { return { success: false, message: 'Unexpected server response.' }; });
        });
    }

    function storeSession(user, token) {
        localStorage.setItem(SESSION_KEY, user.username);
        localStorage.setItem(TOKEN_KEY, token);
        localStorage.setItem(USER_KEY, JSON.stringify(user));
    }

    // ============================================================
    // SERVICE ELEMENTS AND DEPARTMENTS (Same as user dashboard)
    // ============================================================
    const serviceElements = {
        'Leadership and Mgmt': ['Finance', "MD's Office", "ED's Office", "PNO's Office", 'Student Coordinators Office', 'Research', 'Internal Auditor', 'Pastoral'],
        'Human Resource': ["HR Office", 'St Kizito Day Care'],
        'Administrative Support': ["Hospital Admin's Office", 'Procurement', 'Central Store', 'Transport', 'Internal Security Office', 'Records Office'],
        'Access to Care and Patients Rights': ['Access to Care and Patients Rights'],
        'Risk Management': ['Risk Management'],
        'Resuscitation': ['Resuscitation'],
        'Information Mgmt, QA & QI': ['ICT Office', 'Quality Assurance'],
        'Infection Prevention and Control': ['Infection Prevention and Control'],
        'Inpatient Care': ['Medical Care', 'Surgical Care', 'Paediatric Care', 'Obstetrics and Maternity Care', 'IPD Specialist Center', 'ICU'],
        'Ambulatory Care': ['Medical OPD', 'Specialist Center OPD', 'Public Health Dept', 'Emergency Care', 'Dialysis', 'Eye Clinic', 'Dental Clinic'],
        'Operating Theatre and Anaesthetic Care': ['General Operating Theatre', 'Transplant Theatre', 'Specialist Center Theatre'],
        'Laboratory': ['Laboratory'],
        'Radiology and Diagnostic Imaging': ['Radiology and Diagnostic Imaging'],
        'Pharmacy': ['Main Pharmacy', 'Maternity Pharmacy', 'IPD Pharmacy', 'OPD Pharmacy', 'PHD Pharmacy', 'Specialist Center Pharmacy'],
        'Therapeutic Support': ['Physiotherapy', 'Social Worker', 'Psychiatry', 'Others'],
        'Central Sterile Supply Dept': ['CSSD'],
        'Food Service': ['Food Service'],
        'Linen Management': ['Linen Management'],
        'House keeping': ['House keeping'],
        'Maintenance': ['Plumbing', 'Electrical', 'Estates/Building', 'Carpentry', 'Waste Collection'],
        'Medical Equipment Management': ['Medical Equipment Management']
    };

    const serviceElementNames = Object.keys(serviceElements);

    function showToast(message, type = 'success') {
        const toast = document.getElementById('liveToast');
        const body = document.getElementById('toastMessage');
        body.textContent = message;
        toast.className = 'toast align-items-center text-white border-0';
        if (type === 'success') toast.classList.add('bg-success');
        else if (type === 'danger') toast.classList.add('bg-danger');
        else if (type === 'warning') toast.classList.add('bg-warning');
        else toast.classList.add('bg-primary');
        new bootstrap.Toast(toast, { delay: 4000 }).show();
    }

    // ============================================================
    // VALIDATE PHONE NUMBER (Ugandan format - NO DASH)
    // ============================================================
    function validatePhone(phone) {
        const ugandanPhoneRegex = /^(07[0-9]{8})$/;
        return ugandanPhoneRegex.test(phone.replace(/\s/g, ''));
    }

    // ============================================================
    // POPULATE SERVICE ELEMENTS DROPDOWN
    // ============================================================
    function populateServiceElements() {
        const select = document.getElementById('regServiceElement');
        select.innerHTML = '<option value="">Select Service Element</option>';
        for (var i = 0; i < serviceElementNames.length; i++) {
            const opt = document.createElement('option');
            opt.value = serviceElementNames[i];
            opt.textContent = serviceElementNames[i];
            select.appendChild(opt);
        }
    }

    // ============================================================
    // UPDATE DEPARTMENTS BASED ON SELECTED SERVICE ELEMENT
    // ============================================================
    function updateDepartments() {
        const serviceElement = document.getElementById('regServiceElement').value;
        const deptSelect = document.getElementById('regDepartment');
        deptSelect.innerHTML = '<option value="">Select Department</option>';
        
        if (serviceElement && serviceElements[serviceElement]) {
            const depts = serviceElements[serviceElement];
            for (var i = 0; i < depts.length; i++) {
                const opt = document.createElement('option');
                opt.value = depts[i];
                opt.textContent = depts[i];
                deptSelect.appendChild(opt);
            }
        }
    }

    // The backend owns user data; hide the local-storage first-user banner.
    (function checkFirstUser() {
        const notice = document.getElementById('adminNotice');
        if (notice) notice.style.display = 'none';
    })();

    // ============================================================
    // REAL-TIME PHONE VALIDATION
    // ============================================================
    document.getElementById('regPhone').addEventListener('input', function() {
        // Remove any dashes or spaces
        this.value = this.value.replace(/[-\s]/g, '');
        if (this.value.length > 0 && !validatePhone(this.value)) {
            this.classList.add('is-invalid');
        } else {
            this.classList.remove('is-invalid');
        }
    });

    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const username = document.getElementById('regUsername').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const phone = document.getElementById('regPhone').value.trim().replace(/[-\s]/g, '');
        const password = document.getElementById('regPassword').value;
        const confirmPassword = document.getElementById('regConfirmPassword').value;
        const serviceElement = document.getElementById('regServiceElement').value;
        const department = document.getElementById('regDepartment').value;

        // Validation
        if (!username || username.length < 3) { 
            showToast('Username must be at least 3 characters.', 'danger'); 
            return; 
        }
        if (!email || !email.includes('@')) { 
            showToast('Valid email is required.', 'danger'); 
            return; 
        }
        if (!phone) { 
            showToast('Phone number is required.', 'danger'); 
            return; 
        }
        if (!validatePhone(phone)) { 
            showToast('Please enter a valid Ugandan phone number (e.g., 0772123456).', 'danger'); 
            return; 
        }
        if (!password || password.length < 6) { 
            showToast('Password must be at least 6 characters.', 'danger'); 
            return; 
        }
        if (password !== confirmPassword) { 
            showToast('Passwords do not match.', 'danger'); 
            return; 
        }
        if (!serviceElement) { 
            showToast('Please select a service element.', 'danger'); 
            return; 
        }
        if (!department) { 
            showToast('Please select a department.', 'danger'); 
            return; 
        }

        apiPost('/api/auth/register', {
            username: username,
            email: email,
            phone: phone,
            password: password,
            serviceElement: serviceElement,
            department: department
        }).then(function(data) {
            if (data.success && data.data && data.data.token && data.data.user) {
                storeSession(data.data.user, data.data.token);
                const role = data.data.user.role;
                const roleText = role === 'general_admin' ?
                    'You are the General Admin! Redirecting to dashboard...' :
                    'Registration successful! Redirecting...';

                showToast(roleText, 'success');

                setTimeout(function() {
                    if (role === 'general_admin') {
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        window.location.href = 'user-dashboard.html';
                    }
                }, 1000);
            } else if (data.error === 'USERNAME_TAKEN') {
                showToast('Username already exists.', 'danger');
            } else if (data.error === 'EMAIL_TAKEN') {
                showToast('Email already registered.', 'danger');
            } else if (data.error === 'PHONE_TAKEN') {
                showToast('Phone number already registered.', 'danger');
            } else {
                showToast(data.message || 'Registration failed. Please try again.', 'danger');
            }
        }).catch(function() {
            showToast('Cannot reach the server. Please try again later.', 'danger');
        });
    });

    // Initialize dropdowns on page load
    document.addEventListener('DOMContentLoaded', function() {
        populateServiceElements();
    });
</script>
</body>
</html>
