<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Lubaga Hospital Asset Booking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #e8edf5 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            margin: 0;
        }
        .auth-container {
            max-width: 480px;
            width: 100%;
            background: #fff;
            border-radius: 28px;
            padding: 40px 35px 35px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
            margin: 10px;
        }
        .auth-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: #fd7e14;
        }
        .auth-container .auth-header { 
            text-align: center; 
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
        }
        .auth-container .auth-header .logo {
            width: 100%;
            max-width: 280px;
            height: auto;
            max-height: 160px;
            min-height: 100px;
            background: transparent;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            overflow: hidden;
            padding: 0;
            position: relative;
        }
        .auth-container .auth-header .logo img {
            width: 100%;
            height: 100%;
            max-height: 150px;
            object-fit: contain;
            display: block;
            transition: transform 0.3s ease;
        }
        .auth-container .auth-header .logo img:hover {
            transform: scale(1.03);
        }
        .auth-container .auth-header .logo i {
            font-size: 70px;
            color: #fd7e14;
            display: none;
            background: rgba(253, 126, 20, 0.08);
            padding: 20px;
            border-radius: 20px;
        }
        .auth-container .auth-header h2 { 
            font-weight: 800; 
            color: #0a58ca; 
            font-size: 24px; 
            margin: 0;
            letter-spacing: -0.5px;
        }
        .auth-container .auth-header p { 
            color: #6c757d; 
            font-size: 14px; 
            margin-top: 4px;
            font-weight: 400;
        }
        .auth-container .auth-header .highlight { 
            color: #fd7e14; 
            font-weight: 700; 
        }
        .no-users-notice {
            background: linear-gradient(135deg, #fff8f0, #fff3e0);
            border-left: 5px solid #fd7e14;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 18px;
            display: none;
            align-items: flex-start;
            gap: 12px;
            position: relative;
            z-index: 1;
        }
        .no-users-notice .notice-icon { 
            font-size: 22px; 
            color: #fd7e14; 
            flex-shrink: 0;
            margin-top: 1px;
        }
        .no-users-notice .notice-text { 
            font-size: 13px; 
            color: #495057; 
            line-height: 1.5; 
        }
        .no-users-notice .notice-text a { 
            color: #0a58ca; 
            font-weight: 700; 
            text-decoration: none;
        }
        .no-users-notice .notice-text a:hover { 
            text-decoration: underline; 
            color: #fd7e14;
        }
        .auth-container .form-label { 
            font-weight: 600; 
            font-size: 13px; 
            color: #495057; 
            margin-bottom: 4px;
        }
        .auth-container .form-control {
            border-radius: 12px;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            transition: 0.25s ease;
            font-size: 14px;
            background-color: #fafbfc;
            width: 100%;
        }
        .auth-container .form-control:focus {
            border-color: #0a58ca;
            box-shadow: 0 0 0 4px rgba(10, 88, 202, 0.1);
            background-color: #fff;
        }
        .auth-container .form-control::placeholder {
            color: #adb5bd;
            font-size: 13px;
        }
        .auth-container .btn-primary {
            padding: 13px;
            border-radius: 12px;
            font-weight: 700;
            width: 100%;
            font-size: 16px;
            background: linear-gradient(135deg, #0a58ca, #0d6efd);
            border: none;
            transition: 0.3s ease;
            color: #fff;
            letter-spacing: 0.3px;
            position: relative;
            z-index: 1;
            box-shadow: 0 4px 15px rgba(10, 88, 202, 0.3);
        }
        .auth-container .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 35px rgba(10, 88, 202, 0.4);
        }
        .auth-container .btn-primary:active {
            transform: translateY(0);
        }
        .auth-container .btn-primary i { 
            color: #fd7e14;
            font-size: 18px;
            margin-right: 6px;
        }
        .auth-container .auth-link { 
            text-align: center; 
            margin-top: 18px; 
            font-size: 14px; 
            color: #6c757d; 
            position: relative;
            z-index: 1;
        }
        .auth-container .auth-link a { 
            color: #0a58ca; 
            text-decoration: none; 
            font-weight: 700; 
            transition: 0.2s;
        }
        .auth-container .auth-link a:hover { 
            text-decoration: underline; 
            color: #fd7e14; 
        }
        .input-icon { 
            position: relative; 
            z-index: 1;
        }
        .input-icon i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #adb5bd;
            font-size: 18px;
            z-index: 2;
            transition: 0.2s;
        }
        .input-icon .form-control:focus + i {
            color: #0a58ca;
        }
        .input-icon .form-control { 
            padding-left: 46px; 
        }
        .forgot-password-link { 
            text-align: right; 
            margin-top: 2px; 
            margin-bottom: 6px;
            position: relative;
            z-index: 1;
        }
        .forgot-password-link a { 
            color: #6c757d; 
            font-size: 13px; 
            text-decoration: none; 
            cursor: pointer;
            transition: 0.2s;
        }
        .forgot-password-link a:hover { 
            color: #fd7e14; 
            text-decoration: underline; 
        }
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            max-width: 90%;
        }
        .toast {
            border-radius: 14px;
            box-shadow: 0 8px 35px rgba(0, 0, 0, 0.2);
            border: none;
            min-width: 200px;
            max-width: 420px;
        }
        .toast .toast-body { 
            font-size: 14px; 
            padding: 14px 18px; 
            font-weight: 500; 
        }
        .toast .btn-close { 
            padding: 12px; 
            filter: brightness(0) invert(1); 
            opacity: 0.8; 
        }
        .toast .btn-close:hover { opacity: 1; }
        .modal-content { 
            border-radius: 16px; 
            border: none; 
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2); 
        }
        .modal-header { 
            border-radius: 16px 16px 0 0;
            background: #0a58ca !important;
        }
        .modal-footer { 
            border-radius: 0 0 16px 16px; 
        }
        .modal-header .btn-close {
            filter: brightness(0) invert(1);
        }

        /* ============================================================
           SMALL SCREEN FIXES
           ============================================================ */
        @media (max-width: 576px) {
            body {
                padding: 10px;
                align-items: flex-start;
                padding-top: 20px;
            }
            .auth-container { 
                padding: 24px 18px 22px; 
                margin: 0;
                border-radius: 20px;
                max-width: 100%;
            }
            .auth-container .auth-header { 
                margin-bottom: 18px;
            }
            .auth-container .auth-header h2 { 
                font-size: 20px; 
            }
            .auth-container .auth-header p { 
                font-size: 13px; 
            }
            .auth-container .auth-header .logo { 
                max-width: 200px;
                max-height: 120px;
                min-height: 80px;
                margin: 0 auto 10px;
            }
            .auth-container .auth-header .logo img {
                max-height: 110px;
            }
            .auth-container .auth-header .logo i {
                font-size: 50px;
                padding: 14px;
            }
            .no-users-notice { 
                padding: 10px 12px; 
                font-size: 12px;
                margin-bottom: 14px;
            }
            .no-users-notice .notice-icon { 
                font-size: 18px; 
            }
            .no-users-notice .notice-text { 
                font-size: 12px; 
            }
            .auth-container .btn-primary {
                font-size: 15px;
                padding: 12px;
            }
            .input-icon .form-control { 
                padding-left: 42px; 
                padding-top: 11px;
                padding-bottom: 11px;
                font-size: 14px;
                min-height: 46px;
            }
            .input-icon i {
                left: 14px;
                font-size: 16px;
            }
            .auth-container .form-control {
                font-size: 14px;
                padding: 11px 14px;
            }
            .auth-container .auth-link { 
                font-size: 13px;
                margin-top: 14px;
            }
            .forgot-password-link a {
                font-size: 12px;
            }
            .modal-dialog {
                margin: 10px;
            }
            .modal-body {
                padding: 16px;
            }
            .modal-footer {
                padding: 12px 16px;
                flex-wrap: wrap;
                gap: 6px;
            }
            .modal-footer .btn {
                flex: 1;
                min-width: 80px;
            }
        }

        @media (max-width: 400px) {
            body {
                padding: 6px;
                padding-top: 12px;
            }
            .auth-container { 
                padding: 18px 14px 16px; 
                border-radius: 16px;
            }
            .auth-container .auth-header .logo { 
                max-width: 160px;
                max-height: 90px;
                min-height: 60px;
            }
            .auth-container .auth-header .logo img {
                max-height: 80px;
            }
            .auth-container .auth-header .logo i {
                font-size: 40px;
                padding: 12px;
            }
            .auth-container .auth-header h2 { 
                font-size: 18px; 
            }
            .auth-container .auth-header p { 
                font-size: 12px; 
            }
            .auth-container .btn-primary {
                font-size: 14px;
                padding: 10px;
            }
            .input-icon .form-control { 
                padding-left: 38px; 
                padding-top: 9px;
                padding-bottom: 9px;
                font-size: 13px;
                min-height: 40px;
                padding-right: 12px;
            }
            .input-icon i {
                left: 12px;
                font-size: 14px;
            }
            .auth-container .form-control {
                font-size: 13px;
                padding: 9px 12px;
            }
            .auth-container .auth-link { 
                font-size: 12px;
                margin-top: 12px;
            }
            .no-users-notice { 
                padding: 8px 10px; 
                font-size: 11px;
                margin-bottom: 10px;
            }
            .no-users-notice .notice-text { 
                font-size: 11px; 
            }
            .forgot-password-link a {
                font-size: 11px;
            }
            .modal-body {
                padding: 12px;
            }
            .modal-footer .btn {
                font-size: 13px;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>

<div id="loginPage">
    <div class="auth-container">
        <div class="auth-header">
            <div class="logo">
                <img src="lubaga logo.png" alt="Lubaga Hospital" id="hospitalLogo"
                     onerror="this.style.display='none'; document.getElementById('logoIcon').style.display='flex'">
                <i id="logoIcon" class="bi bi-hospital" style="display:none;"></i>
            </div>
            <h2>Lubaga Hospital</h2>
            <p><span class="highlight">Asset Booking System</span></p>
        </div>

        <div class="no-users-notice" id="noUsersNotice">
            <div class="notice-icon"><i class="bi bi-info-circle-fill"></i></div>
            <div class="notice-text">
                <strong>No users found!</strong><br />
                Please <a href="register.html">register here</a> to create the first admin account.
            </div>
        </div>

        <form id="loginForm">
            <div class="mb-3 input-icon">
                <i class="bi bi-person"></i>
                <input type="text" class="form-control" id="loginUsername" placeholder="Username" required>
            </div>
            <div class="mb-3 input-icon">
                <i class="bi bi-lock"></i>
                <input type="password" class="form-control" id="loginPassword" placeholder="Password" required>
            </div>
            <div class="forgot-password-link">
                <a id="forgotPasswordLink">Forgot Password?</a>
            </div>
            <button type="submit" class="btn btn-primary mt-1">
                <i class="bi bi-box-arrow-in-right me-2"></i>Login
            </button>
        </form>
        <div class="auth-link">
            Don't have an account? <a href="register.html">Register here</a>
        </div>
    </div>
</div>

<!-- Forgot Password Modal - Phone Number Based -->
<div class="modal fade" id="forgotPasswordModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title"><i class="bi bi-shield-lock me-2"></i>Reset Password</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="text-muted">Enter your registered phone number to reset your password.</p>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Phone Number</label>
                    <input type="text" class="form-control" id="resetPhone" placeholder="Enter your phone number (e.g., 0772123456)">
                </div>
                <div id="phoneUserContainer" style="display:none;">
                    <div class="alert" style="background:#e8f5e9; border-left:4px solid #28a745; color:#333; padding:10px 14px;">
                        <i class="bi bi-person-check me-2" style="color:#28a745;"></i>
                        <span id="phoneUserDisplay">User found: </span>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">New Password</label>
                        <input type="password" class="form-control" id="newPassword" placeholder="Enter new password (min 4 characters)">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmNewPassword" placeholder="Confirm new password">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" onclick="resetPasswordByPhone()">Reset Password</button>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast-container">
    <div id="liveToast" class="toast align-items-center text-white border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body" id="toastMessage"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const SESSION_KEY = 'lubaga_session';
    const TOKEN_KEY = 'lubaga_token';
    const USER_KEY = 'lubaga_user';

    // Backend endpoint base. Empty string = same origin (served by the API
    // server). Override by setting localStorage['lubaga_api_base'] when the
    // pages are hosted elsewhere.
    const API_BASE = (localStorage.getItem('lubaga_api_base') || 'https://lubaga-hospital-asset-booking-system-production.up.railway.app').replace(/\/+$/, '');

    function apiPost(url, body) {
        return fetch(API_BASE + url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body || {})
        }).then(function(res) {
            return res.json().catch(function() { return { success: false, message: 'Unexpected server response.' }; });
        });
    }

    function showToast(message, type = 'success') {
        const toast = document.getElementById('liveToast');
        const body = document.getElementById('toastMessage');
        body.textContent = message;
        toast.className = 'toast align-items-center text-white border-0';
        if (type === 'success') toast.classList.add('bg-success');
        else if (type === 'danger') toast.classList.add('bg-danger');
        else if (type === 'warning') toast.classList.add('bg-warning');
        else toast.classList.add('bg-primary');
        new bootstrap.Toast(toast, { delay: 4000 }).show();
    }

    function storeSession(user, token) {
        localStorage.setItem(SESSION_KEY, user.username);
        localStorage.setItem(TOKEN_KEY, token);
        localStorage.setItem(USER_KEY, JSON.stringify(user));
    }

    // Confirm the API is reachable; the seeded database always has users.
    (function checkServer() {
        fetch(API_BASE + '/api/health')
            .then(function(res) { if (!res.ok) showToast('Cannot reach the server. Please try again later.', 'danger'); })
            .catch(function() { showToast('Cannot reach the server. Please try again later.', 'danger'); });
    })();

    let resetPhoneUser = '';

    document.getElementById('forgotPasswordLink').addEventListener('click', function(e) {
        e.preventDefault();
        document.getElementById('resetPhone').value = '';
        document.getElementById('phoneUserContainer').style.display = 'none';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmNewPassword').value = '';
        resetPhoneUser = '';
        new bootstrap.Modal(document.getElementById('forgotPasswordModal')).show();
    });

    // Reveal the password fields once the phone looks valid; the server
    // verifies the number belongs to an account when the reset is submitted.
    document.getElementById('resetPhone').addEventListener('input', function() {
        const phone = this.value.trim().replace(/[-\s]/g, '');
        if (/^07[0-9]{8}$/.test(phone)) {
            document.getElementById('phoneUserDisplay').textContent = 'Account found, set a new password below.';
            document.getElementById('phoneUserContainer').style.display = 'block';
            resetPhoneUser = phone;
        } else {
            document.getElementById('phoneUserContainer').style.display = 'none';
            resetPhoneUser = '';
        }
    });

    function resetPasswordByPhone() {
        const phone = document.getElementById('resetPhone').value.trim().replace(/[-\s]/g, '');
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmNewPassword').value;

        if (!resetPhoneUser) {
            showToast('Enter a valid phone number (e.g. 0772123456).', 'danger');
            return;
        }
        if (!newPassword || newPassword.length < 4) {
            showToast('New password must be at least 4 characters.', 'danger');
            return;
        }
        if (newPassword !== confirmPassword) {
            showToast('Passwords do not match.', 'danger');
            return;
        }

        apiPost('/api/auth/forgot-password', { phone: phone, newPassword: newPassword }).then(function(data) {
            if (data.success) {
                bootstrap.Modal.getInstance(document.getElementById('forgotPasswordModal')).hide();
                showToast('Password reset successfully! Please login.', 'success');
                document.getElementById('resetPhone').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmNewPassword').value = '';
                document.getElementById('phoneUserContainer').style.display = 'none';
                resetPhoneUser = '';
            } else if (data.error === 'USER_NOT_FOUND') {
                showToast('No user found with this phone number.', 'danger');
            } else {
                showToast(data.message || 'Password reset failed. Please try again.', 'danger');
            }
        }).catch(function() {
            showToast('Cannot reach the server. Please try again later.', 'danger');
        });
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!username || !password) {
            showToast('Please enter your username and password.', 'warning');
            return;
        }

        apiPost('/api/auth/login', { username: username, password: password }).then(function(data) {
            if (data.success && data.data && data.data.token && data.data.user) {
                storeSession(data.data.user, data.data.token);
                if (data.data.user.role === 'general_admin' || data.data.user.role === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    window.location.href = 'user-dashboard.html';
                }
            } else if (data.error === 'INVALID_CREDENTIALS') {
                showToast('Invalid username or password.', 'danger');
            } else if (data.error === 'ACCOUNT_DISABLED') {
                showToast('Account is disabled. Contact admin.', 'danger');
            } else {
                showToast(data.message || 'Login failed. Please try again.', 'danger');
            }
        }).catch(function() {
            showToast('Cannot reach the server. Please try again later.', 'danger');
        });
    });

    // Check if already logged in - verify the stored token against the API.
    (function checkSession() {
        const session = localStorage.getItem(SESSION_KEY);
        const token = localStorage.getItem(TOKEN_KEY);
        if (!session || !token) return;
        fetch(API_BASE + '/api/auth/me', {
            headers: { 'Authorization': 'Bearer ' + token }
        }).then(function(res) { return res.json(); })
          .then(function(data) {
              if (data.success && data.data && data.data.user) {
                  storeSession(data.data.user, token);
                  if (data.data.user.role === 'general_admin' || data.data.user.role === 'admin') {
                      window.location.href = 'admin-dashboard.html';
                  } else {
                      window.location.href = 'user-dashboard.html';
                  }
              } else {
                  localStorage.removeItem(SESSION_KEY);
                  localStorage.removeItem(TOKEN_KEY);
                  localStorage.removeItem(USER_KEY);
              }
          })
          .catch(function() { /* server unreachable; stay on login */ });
    })();
</script>
</body>
</html>
