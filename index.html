<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Lubaga Hospital Asset Booking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #e8edf5 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .auth-container {
            max-width: 480px;
            width: 100%;
            background: #fff;
            border-radius: 28px;
            padding: 45px 40px 40px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
        }
        .auth-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: #fd7e14;
        }
        .auth-container .auth-header { 
            text-align: center; 
            margin-bottom: 28px;
            position: relative;
            z-index: 1;
        }
        .auth-container .auth-header .logo {
            width: 280px;
            height: 160px;
            background: transparent;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            overflow: hidden;
            padding: 0;
            position: relative;
        }
        .auth-container .auth-header .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: transform 0.3s ease;
        }
        .auth-container .auth-header .logo img:hover {
            transform: scale(1.03);
        }
        .auth-container .auth-header .logo i {
            font-size: 85px;
            color: #fd7e14;
            display: none;
            background: rgba(253, 126, 20, 0.08);
            padding: 20px;
            border-radius: 20px;
        }
        .auth-container .auth-header h2 { 
            font-weight: 800; 
            color: #0a58ca; 
            font-size: 26px; 
            margin: 0;
            letter-spacing: -0.5px;
        }
        .auth-container .auth-header p { 
            color: #6c757d; 
            font-size: 14px; 
            margin-top: 6px;
            font-weight: 400;
        }
        .auth-container .auth-header .highlight { 
            color: #fd7e14; 
            font-weight: 700; 
        }
        .no-users-notice {
            background: linear-gradient(135deg, #fff8f0, #fff3e0);
            border-left: 5px solid #fd7e14;
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 22px;
            display: none;
            align-items: flex-start;
            gap: 14px;
            position: relative;
            z-index: 1;
        }
        .no-users-notice .notice-icon { 
            font-size: 24px; 
            color: #fd7e14; 
            flex-shrink: 0;
            margin-top: 2px;
        }
        .no-users-notice .notice-text { 
            font-size: 13px; 
            color: #495057; 
            line-height: 1.5; 
        }
        .no-users-notice .notice-text a { 
            color: #0a58ca; 
            font-weight: 700; 
            text-decoration: none;
        }
        .no-users-notice .notice-text a:hover { 
            text-decoration: underline; 
            color: #fd7e14;
        }
        .auth-container .form-label { 
            font-weight: 600; 
            font-size: 13px; 
            color: #495057; 
            margin-bottom: 5px;
        }
        .auth-container .form-control {
            border-radius: 12px;
            padding: 13px 18px;
            border: 2px solid #e9ecef;
            transition: 0.25s ease;
            font-size: 14px;
            background-color: #fafbfc;
        }
        .auth-container .form-control:focus {
            border-color: #0a58ca;
            box-shadow: 0 0 0 4px rgba(10, 88, 202, 0.1);
            background-color: #fff;
        }
        .auth-container .form-control::placeholder {
            color: #adb5bd;
            font-size: 13px;
        }
        .auth-container .btn-primary {
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            width: 100%;
            font-size: 16px;
            background: linear-gradient(135deg, #0a58ca, #0d6efd);
            border: none;
            transition: 0.3s ease;
            color: #fff;
            letter-spacing: 0.3px;
            position: relative;
            z-index: 1;
            box-shadow: 0 4px 15px rgba(10, 88, 202, 0.3);
        }
        .auth-container .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 35px rgba(10, 88, 202, 0.4);
        }
        .auth-container .btn-primary:active {
            transform: translateY(0);
        }
        .auth-container .btn-primary i { 
            color: #fd7e14;
            font-size: 18px;
            margin-right: 6px;
        }
        .auth-container .auth-link { 
            text-align: center; 
            margin-top: 22px; 
            font-size: 14px; 
            color: #6c757d; 
            position: relative;
            z-index: 1;
        }
        .auth-container .auth-link a { 
            color: #0a58ca; 
            text-decoration: none; 
            font-weight: 700; 
            transition: 0.2s;
        }
        .auth-container .auth-link a:hover { 
            text-decoration: underline; 
            color: #fd7e14; 
        }
        .input-icon { 
            position: relative; 
            z-index: 1;
        }
        .input-icon i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #adb5bd;
            font-size: 18px;
            z-index: 2;
            transition: 0.2s;
        }
        .input-icon .form-control:focus + i {
            color: #0a58ca;
        }
        .input-icon .form-control { 
            padding-left: 50px; 
        }
        .forgot-password-link { 
            text-align: right; 
            margin-top: 4px; 
            position: relative;
            z-index: 1;
        }
        .forgot-password-link a { 
            color: #6c757d; 
            font-size: 13px; 
            text-decoration: none; 
            cursor: pointer;
            transition: 0.2s;
        }
        .forgot-password-link a:hover { 
            color: #fd7e14; 
            text-decoration: underline; 
        }
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            max-width: 90%;
        }
        .toast {
            border-radius: 14px;
            box-shadow: 0 8px 35px rgba(0, 0, 0, 0.2);
            border: none;
            min-width: 200px;
            max-width: 420px;
        }
        .toast .toast-body { 
            font-size: 14px; 
            padding: 16px 20px; 
            font-weight: 500; 
        }
        .toast .btn-close { 
            padding: 12px; 
            filter: brightness(0) invert(1); 
            opacity: 0.8; 
        }
        .toast .btn-close:hover { opacity: 1; }
        .modal-content { 
            border-radius: 16px; 
            border: none; 
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2); 
        }
        .modal-header { 
            border-radius: 16px 16px 0 0;
            background: #0a58ca !important;
        }
        .modal-footer { 
            border-radius: 0 0 16px 16px; 
        }
        .modal-header .btn-close {
            filter: brightness(0) invert(1);
        }

        @media (max-width: 576px) {
            .auth-container { 
                padding: 30px 20px 28px; 
                margin: 0 10px; 
                border-radius: 20px;
            }
            .auth-container .auth-header h2 { font-size: 22px; }
            .auth-container .auth-header .logo { 
                width: 220px; 
                height: 130px; 
                margin-bottom: 12px;
            }
            .auth-container .auth-header .logo i {
                font-size: 60px;
                padding: 16px;
            }
            .no-users-notice { 
                padding: 12px 14px; 
                font-size: 12px; 
            }
            .no-users-notice .notice-icon { font-size: 20px; }
            .auth-container .btn-primary {
                font-size: 15px;
                padding: 12px;
            }
            .input-icon .form-control { 
                padding-left: 44px; 
                padding-top: 11px;
                padding-bottom: 11px;
                font-size: 13px;
            }
            .input-icon i {
                left: 14px;
                font-size: 16px;
            }
        }
        @media (max-width: 400px) {
            .auth-container .auth-header .logo { 
                width: 180px; 
                height: 110px; 
            }
            .auth-container .auth-header .logo i {
                font-size: 50px;
                padding: 14px;
            }
            .auth-container .auth-header h2 { font-size: 19px; }
            .auth-container .auth-header p { font-size: 13px; }
            .auth-container { padding: 24px 16px 20px; }
            .no-users-notice .notice-text { font-size: 12px; }
        }
    </style>
</head>
<body>

<div id="loginPage">
    <div class="auth-container">
        <div class="auth-header">
            <div class="logo">
                <img src="lubaga logo.png" alt="Lubaga Hospital" id="hospitalLogo"
                     onerror="this.style.display='none'; document.getElementById('logoIcon').style.display='flex'">
                <i id="logoIcon" class="bi bi-hospital" style="display:none;"></i>
            </div>
            <h2>Lubaga Hospital</h2>
            <p><span class="highlight">Asset Booking System</span></p>
        </div>

        <div class="no-users-notice" id="noUsersNotice">
            <div class="notice-icon"><i class="bi bi-info-circle-fill"></i></div>
            <div class="notice-text">
                <strong>No users found!</strong><br />
                Please <a href="register.html">register here</a> to create the first admin account.
            </div>
        </div>

        <form id="loginForm">
            <div class="mb-3 input-icon">
                <i class="bi bi-person"></i>
                <input type="text" class="form-control" id="loginUsername" placeholder="Username" required>
            </div>
            <div class="mb-3 input-icon">
                <i class="bi bi-lock"></i>
                <input type="password" class="form-control" id="loginPassword" placeholder="Password" required>
            </div>
            <div class="forgot-password-link">
                <a id="forgotPasswordLink">Forgot Password?</a>
            </div>
            <button type="submit" class="btn btn-primary mt-2">
                <i class="bi bi-box-arrow-in-right me-2"></i>Login
            </button>
        </form>
        <div class="auth-link">
            Don't have an account? <a href="register.html">Register here</a>
        </div>
    </div>
</div>

<!-- Forgot Password Modal -->
<div class="modal fade" id="forgotPasswordModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title"><i class="bi bi-shield-lock me-2"></i>Security Verification</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="text-muted">Enter your username to verify your identity.</p>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" class="form-control" id="resetUsername" placeholder="Enter your username">
                </div>
                <div id="securityQuestionContainer" style="display:none;">
                    <div class="alert" style="background:#fff3e0; border-left:4px solid #fd7e14; color:#333;">
                        <i class="bi bi-question-circle me-2" style="color:#fd7e14;"></i>
                        <span id="securityQuestionDisplay">What is your mother's maiden name?</span>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Your Answer</label>
                        <input type="text" class="form-control" id="securityAnswer" placeholder="Enter your security answer">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">New Password</label>
                        <input type="password" class="form-control" id="newPassword" placeholder="Enter new password (min 6 characters)">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" onclick="verifySecurity()">Verify & Reset</button>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast-container">
    <div id="liveToast" class="toast align-items-center text-white border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body" id="toastMessage"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const USERS_KEY = 'lubaga_users';
    const SESSION_KEY = 'lubaga_session';

    function getUsers() {
        try {
            const raw = localStorage.getItem(USERS_KEY);
            return raw ? JSON.parse(raw) : {};
        } catch { return {}; }
    }

    function saveUsers(users) {
        localStorage.setItem(USERS_KEY, JSON.stringify(users));
    }

    function showToast(message, type = 'success') {
        const toast = document.getElementById('liveToast');
        const body = document.getElementById('toastMessage');
        body.textContent = message;
        toast.className = 'toast align-items-center text-white border-0';
        if (type === 'success') toast.classList.add('bg-success');
        else if (type === 'danger') toast.classList.add('bg-danger');
        else if (type === 'warning') toast.classList.add('bg-warning');
        else toast.classList.add('bg-primary');
        new bootstrap.Toast(toast, { delay: 4000 }).show();
    }

    // Check if any users exist
    (function checkUsers() {
        const users = getUsers();
        const notice = document.getElementById('noUsersNotice');
        if (Object.keys(users).length === 0) {
            notice.style.display = 'flex';
        }
    })();

    let resetUsername = '';

    document.getElementById('forgotPasswordLink').addEventListener('click', function(e) {
        e.preventDefault();
        const users = getUsers();
        if (Object.keys(users).length === 0) {
            showToast('No users registered yet. Please register first.', 'warning');
            return;
        }
        document.getElementById('resetUsername').value = '';
        document.getElementById('securityQuestionContainer').style.display = 'none';
        document.getElementById('securityAnswer').value = '';
        document.getElementById('newPassword').value = '';
        new bootstrap.Modal(document.getElementById('forgotPasswordModal')).show();
    });

    document.getElementById('resetUsername').addEventListener('input', function() {
        const username = this.value.trim();
        const users = getUsers();
        if (username && users[username]) {
            document.getElementById('securityQuestionDisplay').textContent = users[username].securityQuestion || 'What is your mother\'s maiden name?';
            document.getElementById('securityQuestionContainer').style.display = 'block';
            resetUsername = username;
        } else {
            document.getElementById('securityQuestionContainer').style.display = 'none';
            resetUsername = '';
        }
    });

    function verifySecurity() {
        const username = resetUsername;
        const answer = document.getElementById('securityAnswer').value.trim().toLowerCase();
        const newPassword = document.getElementById('newPassword').value;

        if (!username) {
            showToast('Please enter a valid username.', 'danger');
            return;
        }

        const users = getUsers();
        if (!users[username]) {
            showToast('User not found.', 'danger');
            return;
        }

        if (users[username].securityAnswer !== answer) {
            showToast('Incorrect security answer. Please try again.', 'danger');
            return;
        }

        if (!newPassword || newPassword.length < 6) {
            showToast('New password must be at least 6 characters.', 'danger');
            return;
        }

        users[username].password = newPassword;
        saveUsers(users);
        bootstrap.Modal.getInstance(document.getElementById('forgotPasswordModal')).hide();
        showToast('Password reset successfully! Please login.', 'success');
        document.getElementById('resetUsername').value = '';
        document.getElementById('securityAnswer').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('securityQuestionContainer').style.display = 'none';
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;

        const users = getUsers();

        if (Object.keys(users).length === 0) {
            showToast('No users registered. Please register first.', 'warning');
            return;
        }

        if (!users[username]) {
            showToast('Invalid username or password.', 'danger');
            return;
        }
        if (users[username].password !== password) {
            showToast('Invalid username or password.', 'danger');
            return;
        }
        if (users[username].active === false) {
            showToast('Account is disabled. Contact admin.', 'danger');
            return;
        }

        localStorage.setItem(SESSION_KEY, username);

        if (users[username].role === 'general_admin' || users[username].role === 'admin') {
            window.location.href = 'admin-dashboard.html';
        } else {
            window.location.href = 'user-dashboard.html';
        }
    });

    // Check if already logged in
    (function checkSession() {
        const session = localStorage.getItem(SESSION_KEY);
        const users = getUsers();
        if (session && users[session] && users[session].active !== false) {
            if (users[session].role === 'general_admin' || users[session].role === 'admin') {
                window.location.href = 'admin-dashboard.html';
            } else {
                window.location.href = 'user-dashboard.html';
            }
        }
    })();
</script>
</body>
</html>
